<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wedger</title>

    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/components.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Startup overlay (also the "failed to start" state). Hidden by main.js once the shell is up. -->
    <div id="loading-overlay" role="status" aria-live="polite">
        <div id="loading-title">Wedger</div>
        <div class="spinner" aria-hidden="true"></div>
        <div id="loading-details">Initializing runtime...</div>
        <button id="loading-retry" class="btn" type="button" hidden>Reload</button>
    </div>

    <aside id="sidebar-left" aria-label="Sidebar">
        <header class="sidebar__header">
            <h2 id="sidebar-left-logo">Wedger</h2>
            <button id="slide-btn" class="icon-btn" type="button" aria-label="Hide the sidebar">
                <span class="icon icon--hide-sidebar" aria-hidden="true"></span>
            </button>
        </header>

        <nav class="sidebar__nav" aria-label="Files">
            <div class="sidebar__section-head">
                <button id="journals-dropdown-btn" class="sidebar__section-toggle" type="button" aria-expanded="true"
                    aria-controls="journals-list">
                    Journals
                    <span class="icon icon--dropdown" aria-hidden="true"></span>
                </button>
                <button id="new-file-btn" class="icon-btn" type="button" aria-label="Create a new file"
                    data-open="wedger:create-file">
                    <span class="icon icon--new-file" aria-hidden="true"></span>
                </button>
                <button id="import-file-btn" class="icon-btn" type="button" aria-label="Import a file"
                    data-open="wedger:import-file">
                    <span class="icon icon--import-file" aria-hidden="true"></span>
                </button>
            </div>
            <!-- filled by sidebar.js from the file store -->
            <ul id="journals-list" class="sidebar__files"></ul>

            <button id="timeline-btn" class="sidebar__row" type="button" data-open="wedger:timeline"
                data-uri="wedger:timeline">
                <span class="icon icon--calendar" aria-hidden="true"></span>
                <span class="sidebar__row-name">Timeline</span>
            </button>
            <button id="reports-output-btn" class="sidebar__row" type="button" data-open="wedger:reports-output"
                data-uri="wedger:reports-output">
                <span class="icon icon--reports" aria-hidden="true"></span>
                <span class="sidebar__row-name">Reports output</span>
            </button>
        </nav>

        <footer class="sidebar__footer">
            <!-- signed out -->
            <button type="button" id="google-login-btn" class="btn sidebar__google-btn">
                <img class="icon-google" src="./assets/icons/google.svg" alt="">
                Sign in with Google
            </button>
            <!-- signed in -->
            <div id="sidebar-sync-status" class="sidebar__sync-status" role="status" hidden></div>
            <div id="user-profile-container" hidden>
                <button type="button" id="user-avatar-btn" class="avatar" aria-label="Google settings">
                    <span id="user-avatar"></span>
                </button>
            </div>
            <button id="settings-btn" class="icon-btn" type="button" aria-label="Open settings">
                <span class="icon icon--settings" aria-hidden="true"></span>
            </button>
        </footer>
    </aside>

    <!-- drag handle (behaviour: assets/js/ui/helpers.js) -->
    <div id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" aria-valuemin="15"
        aria-valuemax="40" tabindex="0"></div>

    <div id="workbench">
        <header id="file-tab-bar" class="tabstrip">
            <button id="show-sidebar-btn" class="icon-btn" type="button" aria-label="Show the sidebar" hidden>
                <span class="icon icon--hide-sidebar" aria-hidden="true" style="transform: scaleX(-1)"></span>
            </button>
            <div id="file-tabs" class="tabstrip__tabs" role="tablist" aria-label="Open files"></div>
            <button id="file-tab-options-btn" class="icon-btn" type="button" aria-haspopup="menu"
                aria-label="Open options of the file tab area">
                <span class="icon icon--dots" aria-hidden="true"></span>
            </button>
        </header>

        <!-- Each open file mounts its own menu bar in here; hidden when the file has none. -->
        <div id="file-menu-bar" hidden></div>

        <!-- Each open file mounts its own panel in here. Nothing about any file is written in this HTML. -->
        <main id="editor-area">
            <div id="editor-empty" class="editor-empty">
                <p>Nothing is open.</p>
                <div style="display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center">
                    <button class="btn btn--primary" type="button" data-open="wedger:create-file">New file</button>
                    <button class="btn" type="button" data-open="wedger:import-file">Import file</button>
                    <button class="btn" type="button" data-open="wedger:welcome">Welcome</button>
                </div>
            </div>
        </main>
    </div>

    <div id="overlay-root" aria-live="polite"></div>

    <!-- New UI shell (phase 1: UI only) -->
    <script type="module" src="./assets/js/shell/main.js"></script>
    <script src="./assets/js/ui/helpers.js" defer></script>

    <!-- Parked until the integration phase (engine, state, storage) -->
    <!-- <script src="./assets/js/init.js" defer></script> -->
    <!-- <script type="module" src="./assets/js/state.js"></script> -->
    <!-- <script type="module" src="./assets/js/app.js"></script> -->
</body>

</html>
