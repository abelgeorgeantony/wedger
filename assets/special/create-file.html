<style>
  .sf-create__name { flex: 3 1 14rem; }
  .template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); gap: .75rem; margin-top: .4rem; }
  .template-card { position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
  .template-card:hover { border-color: var(--border-strong); }
  .template-card.is-selected { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .template-card.is-disabled { opacity: .45; cursor: not-allowed; }
  .template-card input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .template-card:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .template-card__preview { height: 5.2rem; padding: .55rem .7rem; background: var(--surface-2); border-bottom: 1px solid var(--border); font-family: var(--font-raw); font-size: .74rem; line-height: 1.45; color: var(--text-muted); overflow: hidden; white-space: pre; }
  .template-card__name { padding: .55rem .75rem 0; font-family: var(--font-read); font-weight: 600; }
  .template-card__desc { padding: 0 .75rem .65rem; font-family: var(--font-read); font-size: .85rem; color: var(--text-muted); }
</style>
<form data-slot="form" novalidate>
  <h1 class="sf__title">Create file</h1>
  <p class="sf__subtitle">Name your file and pick a starting point.</p>

  <div class="form-row">
    <div class="field sf-create__name">
      <label class="field__label" for="cf-name">File name</label>
      <input class="input" id="cf-name" name="name" placeholder="household-2026" autocomplete="off" spellcheck="false" required>
    </div>
    <div class="field">
      <label class="field__label" for="cf-ext">Type</label>
      <select class="select" id="cf-ext" name="ext">
        <option value=".journal">.journal</option>
        <option value=".timeclock">.timeclock</option>
        <option value=".timedot">.timedot</option>
        <option value=".csv">.csv (with rules file)</option>
        <option value=".rules">.rules</option>
      </select>
    </div>
  </div>
  <p class="field__error" data-slot="error" role="alert" hidden style="margin-top:.4rem"></p>

  <fieldset style="margin-top:1.25rem">
    <legend class="field__label">Apply template</legend>
    <div class="template-grid" data-slot="templates" role="radiogroup" aria-label="Templates">
      <span class="field__hint">Loading templates…</span>
    </div>
  </fieldset>

  <div class="sf__actions">
    <button class="btn" type="button" data-action="close">Cancel</button>
    <button class="btn btn--primary" type="submit">Create file</button>
  </div>
</form>
