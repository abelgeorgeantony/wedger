<style>
  .sf-welcome {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sf-welcome__hero {
    width: 100%;
    max-width: 30rem;
    padding: 2rem 0;
  }

  .sf-welcome__logo {
    font-family: var(--font-brand);
    font-weight: 400;
    font-size: clamp(3.4rem, 11vw, 5rem);
    line-height: 1;
    -webkit-text-stroke: .5px currentColor;
  }

  .sf-welcome__desc {
    font-family: var(--font-read);
    font-size: 1.15rem;
    margin-top: .9rem;
  }

  .sf-welcome__note {
    font-family: var(--font-read);
    font-size: .95rem;
    line-height: 1.55;
    color: var(--text-muted);
    margin-top: .5rem;
  }

  .sf-welcome__actions {
    display: flex;
    gap: .6rem;
    flex-wrap: wrap;
    margin-top: 1.5rem;
  }

  .sf-welcome__engine {
    font-family: var(--font-read);
    font-size: .8rem;
    color: var(--text-faint);
    margin-top: 2.5rem;
  }
</style>

<section class="sf-welcome__hero" aria-labelledby="welcome-title">
  <h1 class="sf-welcome__logo" id="welcome-title">Wedger</h1>
  <p class="sf-welcome__desc">Plain text accounting, without the terminal.</p>
  <p class="sf-welcome__note" data-show="signed-out">Files are stored as plain text in this browser. Sign in with
    Google to sync them with your own Drive.</p>

  <div class="sf-welcome__actions">
    <button class="btn btn--primary" type="button" data-open="wedger:create-file"><span class="icon icon--new-file"
        aria-hidden="true"></span>New file</button>
    <button class="btn" type="button" data-open="wedger:import-file"><span class="icon icon--import-file"
        aria-hidden="true"></span>Import file</button>
    <button class="btn" type="button" data-action="sign-in" data-show="signed-out"><img class="icon-google"
        src="assets/icons/google.svg" alt="">Sign in with Google</button>
    <button class="btn" type="button" data-open="wedger:google-settings" data-show="signed-in">Google settings</button>
  </div>

  <p class="sf-welcome__engine">Balance checks and reports are run by hledger, compiled to WebAssembly.</p>
</section>
