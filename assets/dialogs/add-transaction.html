<style>
  .atx__tabs { display: inline-flex; padding: 2px; gap: 2px; background: var(--selected); border-radius: var(--radius); align-self: flex-start; }
  .atx__tabs label { padding: .25rem .85rem; border-radius: calc(var(--radius) - 2px); cursor: pointer; color: var(--text-muted); font-size: .92rem; }
  .atx__tabs label:has(input:checked) { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  .atx__tabs label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
  .atx__tabs input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .atx__posting { display: grid; grid-template-columns: 1fr 10rem auto; gap: .5rem; align-items: start; margin-bottom: .4rem; }
  .atx__remove { padding: .45rem .6rem; }
  .atx__hint { font-family: var(--font-read); color: var(--text-muted); font-size: .85rem; margin-top: .35rem; }
  .atx__rawbox .cm-wrapper { height: 11rem; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .atx__rawbox .cm-wrapper:focus-within { border-color: var(--accent); }
  @media (max-width: 520px) { .atx__posting { grid-template-columns: 1fr 6.5rem auto; } }
</style>
<form data-slot="form" novalidate>
  <div class="dialog__body">
    <div>
      <h2 class="dialog__title" data-slot="title">Add transaction</h2>
      <p class="dialog__message" data-slot="subtitle">hledger checks that it balances before anything is saved.</p>
    </div>

    <div class="atx__tabs" role="radiogroup" aria-label="Entry mode">
      <label><input type="radio" name="mode" value="form" checked> Form</label>
      <label><input type="radio" name="mode" value="raw"> Raw text</label>
    </div>

    <div data-slot="pane-form">
      <div class="form-row">
        <div class="field"><label class="field__label" for="atx-date">Date</label><input class="input" id="atx-date" name="date" type="date" required></div>
        <div class="field" style="flex:3 1 14rem"><label class="field__label" for="atx-desc">Description</label><input class="input" id="atx-desc" name="description" placeholder="e.g. Groceries" autocomplete="off" required></div>
      </div>
      <div style="margin-top:.8rem">
        <div class="field__label" style="margin-bottom:.3rem">Postings</div>
        <div data-slot="postings"></div>
        <button class="btn btn--small btn--ghost" type="button" data-act="add-posting"><span class="icon icon--plus" aria-hidden="true"></span> Add posting</button>
        <p class="atx__hint">Leave one amount empty and hledger fills in the balancing amount.</p>
      </div>
    </div>

    <div data-slot="pane-raw" hidden>
      <div class="field atx__rawbox"><span class="field__label">Transaction text</span><textarea class="textarea atx__raw" name="raw" rows="9" spellcheck="false" wrap="off" aria-label="Transaction text"></textarea></div>
    </div>

    <p class="banner banner--warn" data-slot="notice" role="status" hidden></p>
    <p class="banner banner--warn" data-slot="warning" role="status" hidden></p>
    <div class="banner banner--error" data-slot="error" role="alert" hidden></div>
    <datalist id="atx-accounts"></datalist>
  </div>
  <div class="dialog__actions">
    <button class="btn" type="button" data-act="cancel">Cancel</button>
    <button class="btn btn--primary" type="submit" data-slot="submit">Add transaction</button>
  </div>
</form>
