<style>
  .jv { height: 100%; display: flex; flex-direction: column; }

  /* ---------- rendered ---------- */
  .jv__rendered { flex: 1; min-height: 0; overflow: auto; }
  .jv__page { max-width: 62rem; margin: 0 auto; padding: 1rem clamp(1rem, 4vw, 2.5rem) 3rem; }

  .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* ---------- transactions: a day-pinned register ----------
     Two ways to see a date: while the list is sorted by date a pill per day sticks to the top of the scroll area
     (.day__pill), and EVERY row carries its own two-line date rail (.txn__date), so the eye can stay on one transaction
     and still read its date. Rows are not cards: a hairline between them, nothing else. */
  .jv__listmeta { margin: 0 0 .5rem; min-height: 0; font-family: var(--font-read); color: var(--text-muted); font-size: .85rem; }
  .jv__listmeta:empty { display: none; }

  .jv__chips { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-bottom: .6rem; }
  .jv__chips-clear { font-size: .85rem; color: var(--text-muted); padding: .15rem .4rem; border-radius: 6px; }
  .jv__chips-clear:hover { color: var(--text); background: var(--hover); }

  .jv__notice { margin-bottom: .6rem; display: flex; flex-direction: column; gap: .4rem; }

  /* One quiet toolbar: "3 selected · Select all visible · Clear · Delete… · Done". Sticky above the day pills. */
  .jv__selbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; flex-wrap: wrap; gap: .15rem .6rem; margin-bottom: .5rem; padding: .3rem .4rem .3rem .85rem; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow-sm); font-family: var(--font-read); font-size: .9rem; }
  .jv__selbar strong { font-weight: 650; }
  .jv__selbar-note { color: var(--text-muted); font-size: .84rem; }
  .jv__selbar-actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: .15rem; }

  .ledger { border-top: 1px solid var(--border); }

  .day { position: relative; }
  .day__pill {
    position: sticky; top: var(--pinned-top, 0px); z-index: 3;
    display: flex; align-items: baseline; gap: .55rem; width: fit-content; max-width: 100%;
    margin: .7rem 0 .25rem .35rem; padding: .22rem .8rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    box-shadow: 0 0 0 .35rem var(--bg);        /* rows never show through right around a stuck pill */
    font-family: var(--font-read); font-size: .82rem; font-weight: 600; color: var(--text-muted);
  }
  .day__count { font-weight: 500; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  .txn {
    position: relative; display: grid; align-items: start;
    grid-template-columns: auto 2.6rem minmax(0, 1fr) auto;
    grid-template-areas: "sel date main act";
    padding: .7rem .5rem; border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
    font-family: var(--font-read);
    transition: background-color .12s ease;
    content-visibility: auto; contain-intrinsic-size: auto 4.4rem;      /* keeps thousands of rows cheap to scroll */
  }
  .txn:hover { background: var(--hover); }
  .txn.is-selected { background: var(--accent-soft); }
  .txn.is-selected::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 2px; background: var(--accent); }
  .txn__select { grid-area: sel; display: flex; align-items: center; justify-content: center; min-width: 1.6rem; min-height: 1.6rem; padding-right: .5rem; cursor: pointer; }
  .txn__select input { width: 1.1rem; height: 1.1rem; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .txn__select input:disabled { cursor: not-allowed; }

  .txn__date { grid-area: date; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; font-variant-numeric: tabular-nums; color: var(--text-muted); padding-top: .1rem; }
  .txn__day { font-size: 1.02rem; font-weight: 600; color: var(--text); }
  .txn__wd { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }

  .txn__main { grid-area: main; min-width: 0; }
  .txn__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .75rem; }
  .txn__desc { flex: 1 1 12rem; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .65rem; font-size: 1.02rem; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
  .txn__desc.is-empty { font-weight: 500; color: var(--text-muted); font-style: italic; }
  .txn__note { font-size: .78rem; font-weight: 500; color: var(--text-muted); white-space: nowrap; }
  .txn__headline { margin-left: auto; font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .txn__headline.is-neg { color: var(--neg); }

  .txn__postings { list-style: none; margin: .25rem 0 0; padding: 0; font-size: .9rem; }
  .txn__posting { display: flex; align-items: baseline; justify-content: space-between; gap: 1.25rem; padding: .05rem 0; }
  .txn__account { flex: 1 1 auto; min-width: 0; color: var(--text-muted); overflow-wrap: anywhere; }
  .txn__amount { flex: none; text-align: right; font-variant-numeric: tabular-nums; white-space: pre; }
  .txn__amount.is-neg { color: var(--neg); }

  .txn__actions { grid-area: act; display: flex; gap: .1rem; padding-left: .5rem; margin: -.25rem -.25rem 0 0; }
  .txn__actions .icon-btn { color: var(--text-faint); }
  .txn__actions .icon-btn:hover:not(.is-disabled), .txn__actions .icon-btn:focus-visible { color: var(--text); }
  .txn__actions .icon-btn--danger:hover:not(.is-disabled) { color: var(--danger); }
  .txn__actions .icon-btn:focus-visible, .txn__select input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .txn__actions .icon-btn.is-disabled { opacity: .35; cursor: not-allowed; }
  .txn.is-locked .txn__desc { color: var(--text-muted); }
  .ledger.is-selecting .txn { cursor: pointer; }
  .ledger.is-selecting .txn.is-locked { cursor: default; }
  .ledger.is-selecting .txn__actions { display: none; }          /* editing one row while bulk-selecting is how people mis-tap */
  /* Mouse users see the actions on hover or keyboard focus; touch users always see them. */
  @media (hover: hover) and (pointer: fine) {
    .txn__actions { opacity: 0; }
    .txn:hover .txn__actions, .txn:focus-within .txn__actions { opacity: 1; }
  }
  @media (pointer: coarse) { .txn__actions .icon-btn { width: 2.5rem; height: 2.5rem; } .txn__select { min-width: 2.2rem; min-height: 2.2rem; } .txn__select input { width: 1.3rem; height: 1.3rem; } }
  @media (prefers-reduced-motion: reduce) { .txn { transition: none; } }
  @media (max-width: 560px) {
    .txn { padding-inline: .25rem; }
    .txn__headline { margin-left: 0; flex-basis: 100%; }         /* wraps under the description instead of overflowing */
    .txn__postings { font-size: .88rem; }
    .txn__posting { gap: .85rem; }
  }

  .jv__empty { text-align: center; color: var(--text-muted); padding: 2.6rem 1rem; border: 1px dashed var(--border-strong); border-radius: var(--radius); font-family: var(--font-read); }
  .jv__empty .btn { margin: .8rem .25rem 0; }
  .jv__state { margin: 2rem auto; max-width: 34rem; text-align: center; font-family: var(--font-read); color: var(--text-muted); }
  .jv__state .spinner { margin: 0 auto .7rem; }
  .jv__state .banner { text-align: left; }
  .jv__state pre { margin-top: .5rem; white-space: pre-wrap; font-family: var(--font-raw); font-size: .88rem; }
  .jv__state-actions { display: flex; gap: .5rem; justify-content: center; margin-top: .9rem; }

  /* ---------- raw ---------- */
  .jv__raw { flex: 1; min-height: 0; display: flex; background: var(--surface); }
  .rawedit { flex: 1; display: flex; min-width: 0; min-height: 0; }
  .rawedit__text {            /* the value bridge behind the CodeMirror editor (hidden once it is mounted) */
    flex: 1; min-width: 0; padding: .75rem; border: 0; resize: none; outline: none;
    font-family: var(--font-raw); font-size: .92rem; line-height: 1.55; font-variant-numeric: tabular-nums;
    white-space: pre; overflow: auto; background: transparent; tab-size: 4;
  }

  /* ---------- status bar ---------- */
  .statusbar {
    flex: none; display: flex; gap: 1.1rem; flex-wrap: wrap; align-items: center;
    padding: .28rem .9rem; font-size: .8rem; color: var(--text-muted);
    background: var(--sidebar-bg); border-top: 1px solid var(--border);
  }
  .statusbar[hidden] { display: none; }
  .statusbar__spacer { flex: 1; }
  .statusbar__warn { color: var(--danger); }
</style>

<section class="jv__rendered" data-pane="rendered" aria-label="Rendered journal">
  <div class="jv__page">
    <div class="jv__state" data-slot="state" role="status"></div>

    <div data-slot="content" hidden>
      <h1 class="visually-hidden" data-slot="heading">Journal</h1>

      <section aria-label="Transactions">
        <p class="jv__listmeta" data-slot="list-meta"></p>
        <div class="jv__chips" data-slot="chips" hidden></div>
        <div class="jv__notice" data-slot="list-notice" hidden></div>
        <div class="jv__selbar" data-slot="selbar" role="status" aria-live="polite" hidden>
          <strong data-slot="sel-count"></strong>
          <span class="jv__selbar-note" data-slot="sel-note"></span>
          <span class="jv__selbar-actions">
            <button class="btn btn--small btn--ghost" type="button" data-act="bar-select-all">Select all visible</button>
            <button class="btn btn--small btn--ghost" type="button" data-act="bar-clear">Clear</button>
            <button class="btn btn--small btn--ghost btn--danger" type="button" data-act="bar-delete">Delete…</button>
            <button class="btn btn--small" type="button" data-act="exit-select">Done</button>
          </span>
        </div>
        <div class="ledger" data-slot="list"></div>
        <div class="jv__empty" data-slot="empty" hidden></div>
      </section>
    </div>
  </div>
</section>

<section class="jv__raw" data-pane="raw" aria-label="Raw file text" hidden>
  <div class="rawedit">
    <textarea class="rawedit__text" data-slot="text" spellcheck="false" wrap="off" aria-label="Raw file text"></textarea>
  </div>
</section>

<!-- Editor status line: shown in raw view only (journal.js toggles `hidden`). -->
<footer class="statusbar" data-slot="status" hidden>
  <span data-slot="status-pos"></span>
  <span data-slot="status-lines"></span>
  <span class="statusbar__spacer"></span>
  <span data-slot="status-sync"></span>
  <span data-slot="status-saved"></span>
</footer>
