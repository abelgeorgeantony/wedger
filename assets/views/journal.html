<style>
  .jv { height: 100%; display: flex; flex-direction: column; }
  .jv__rendered { flex: 1; min-height: 0; overflow: auto; padding: 1.5rem max(clamp(1rem, 4vw, 2.5rem), calc((100% - 62rem) / 2)) 2.5rem; }
  .jv__header { display: flex; gap: 1rem; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
  .jv__title { font-size: 1.6rem; font-weight: 700; overflow-wrap: anywhere; }
  .jv__meta { color: var(--text-muted); margin-top: .15rem; }
  .jv__actions { display: flex; gap: .5rem; flex-wrap: wrap; }
  .jv__stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .75rem; margin: 1.1rem 0 1.4rem; }
  .jv-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .8rem 1rem; }
  .jv-stat__label { color: var(--text-muted); font-size: .85rem; }
  .jv-stat__value { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .jv-stat__value--pos { color: var(--ok); }
  .jv-stat__value--neg { color: var(--danger); }
  .jv__date { margin: 1.2rem 0 .5rem; font-size: .85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .jv-txn { display: flex; gap: 1rem; justify-content: space-between; align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .8rem 1rem; margin-bottom: .5rem; }
  .jv-txn__main { flex: 1; min-width: 0; }
  .jv-txn__desc { font-weight: 600; overflow-wrap: anywhere; }
  .jv-txn__date { color: var(--text-muted); font-size: .85rem; }
  .jv-txn__postings { margin-top: .3rem; display: grid; grid-template-columns: 1fr auto; gap: .1rem 1.5rem; font-family: var(--font-mono); font-size: .9rem; }
  .jv-txn__amount { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .jv-txn__amount--inferred { color: var(--text-muted); }
  .jv-txn__actions { display: flex; flex-direction: column; gap: .3rem; }
  .jv__empty { text-align: center; color: var(--text-muted); padding: 3rem 1rem; border: 1px dashed var(--border); border-radius: var(--radius); }
  .jv__empty p + .btn { margin-top: .75rem; }
  .jv__notice { margin-bottom: 1rem; }

  .jv__raw { flex: 1; min-height: 0; display: flex; background: var(--surface); }
  .rawedit { flex: 1; display: flex; min-width: 0; min-height: 0; }
  .rawedit__gutter {
    flex: none; min-width: 3.2rem; padding: .75rem .6rem .75rem .5rem; overflow: hidden;
    text-align: right; white-space: pre; user-select: none;
    font-family: var(--font-mono); font-size: .9rem; line-height: 1.5;
    color: var(--text-muted); background: var(--surface-2); border-right: 1px solid var(--border);
  }
  .rawedit__text {
    flex: 1; min-width: 0; padding: .75rem; border: 0; resize: none; outline: none;
    font-family: var(--font-mono); font-size: .9rem; line-height: 1.5; white-space: pre; overflow: auto;
    background: transparent; tab-size: 4;
  }

  .statusbar {
    flex: none; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;
    padding: .3rem .9rem; font-size: .82rem; color: var(--text-muted);
    background: var(--sidebar-bg); border-top: 1px solid var(--border);
  }
  .statusbar__spacer { flex: 1; }
</style>

<section class="jv__rendered" data-pane="rendered" aria-label="Rendered journal">
  <header class="jv__header">
    <div>
      <h1 class="jv__title" data-slot="title"></h1>
      <p class="jv__meta" data-slot="meta"></p>
    </div>
    <div class="jv__actions">
      <button class="btn" type="button" data-act="rename">Rename</button>
      <button class="btn btn--danger" type="button" data-act="delete">Delete</button>
      <button class="btn btn--primary" type="button" data-act="add-txn"><span class="icon icon--plus" aria-hidden="true"></span>Add transaction</button>
    </div>
  </header>
  <div class="jv__stats" data-slot="stats"></div>
  <div data-slot="list"></div>
  <div class="jv__empty" data-slot="empty" hidden></div>
</section>

<section class="jv__raw" data-pane="raw" aria-label="Raw journal text" hidden>
  <div class="rawedit">
    <div class="rawedit__gutter" data-slot="gutter" aria-hidden="true"></div>
    <textarea class="rawedit__text" data-slot="text" spellcheck="false" wrap="off" aria-label="Raw file text"></textarea>
  </div>
</section>

<footer class="statusbar" data-slot="status">
  <span data-slot="status-view"></span>
  <span data-slot="status-pos"></span>
  <span class="statusbar__spacer"></span>
  <span>UTF-8</span>
  <span data-slot="status-saved"></span>
</footer>
