<style>
  .jv { height: 100%; display: flex; flex-direction: column; }

  /* ---------- rendered ---------- */
  .jv__rendered { flex: 1; min-height: 0; overflow: auto; }
  .jv__page { max-width: 62rem; margin: 0 auto; padding: 1.5rem clamp(1rem, 4vw, 2.5rem) 3rem; }

  .jv__overview { display: flex; gap: 1rem; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
  .jv__heading { font-family: var(--font-read); font-size: 1.55rem; font-weight: 650; letter-spacing: -.01em; line-height: 1.2; }
  .jv__sub { font-family: var(--font-read); color: var(--text-muted); margin-top: .25rem; }

  .jv__stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .75rem; margin: 1.1rem 0 .75rem; }
  .jv-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .85rem 1rem .8rem; min-width: 0; }
  .jv-stat__label { font-family: var(--font-read); color: var(--text-muted); font-size: .82rem; font-weight: 500; }
  .jv-stat__value { font-family: var(--font-read); font-size: 1.45rem; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: .15rem; overflow-wrap: anywhere; }
  .jv-stat__value.is-neg { color: var(--neg); }
  .jv-stat__note { font-family: var(--font-read); color: var(--text-muted); font-size: .8rem; margin-top: .15rem; }

  .jv-top { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .85rem 1rem; margin-bottom: 1.4rem; }
  .jv-top__title { font-family: var(--font-read); font-size: .85rem; font-weight: 600; color: var(--text-muted); margin-bottom: .55rem; }
  .jv-top__row { display: grid; grid-template-columns: minmax(7rem, 11rem) 1fr auto; gap: .8rem; align-items: center; padding: .22rem 0; font-family: var(--font-read); }
  .jv-top__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jv-top__bar { height: .45rem; border-radius: 999px; background: var(--hover); overflow: hidden; }
  .jv-top__bar > span { display: block; height: 100%; border-radius: inherit; background: var(--text-faint); }
  .jv-top__amount { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  @media (max-width: 520px) { .jv-top__row { grid-template-columns: 1fr auto; } .jv-top__bar { display: none; } }

  .jv__listhead { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: .5rem; }
  .jv__listtitle { font-family: var(--font-read); font-size: 1.05rem; font-weight: 650; }
  .jv__listmeta { font-family: var(--font-read); color: var(--text-muted); font-size: .85rem; }

  .jv__chips { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-bottom: .5rem; }
  .jv__chips-clear { font-size: .85rem; color: var(--text-muted); padding: .15rem .4rem; border-radius: 6px; }
  .jv__chips-clear:hover { color: var(--text); background: var(--hover); }

  .jv__date { margin: 1.15rem 0 .4rem; font-family: var(--font-read); font-size: .8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
  .jv-txn { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .7rem 1rem .7rem; margin-bottom: .4rem; }
  .jv-txn:hover { border-color: var(--border-strong); }
  .jv-txn__top { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; padding-right: 4.4rem; }
  .jv-txn__desc { font-family: var(--font-read); font-weight: 600; overflow-wrap: anywhere; }
  .jv-txn__total { font-family: var(--font-read); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .jv-txn__postings { margin-top: .3rem; display: grid; grid-template-columns: 1fr auto; gap: .05rem 1.5rem; font-family: var(--font-read); font-size: .9rem; color: var(--text-muted); }
  .jv-txn__account { overflow-wrap: anywhere; }
  .jv-txn__amount { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .jv-txn__amount.is-neg { color: var(--neg); }
  .jv-txn__actions { position: absolute; top: .4rem; right: .45rem; display: flex; gap: .1rem; opacity: 0; transition: opacity .12s; }
  .jv-txn:hover .jv-txn__actions, .jv-txn:focus-within .jv-txn__actions { opacity: 1; }
  @media (hover: none) { .jv-txn__actions { opacity: 1; } }
  .jv-txn__top { min-height: 1.6rem; }

  .jv__empty { text-align: center; color: var(--text-muted); padding: 2.6rem 1rem; border: 1px dashed var(--border-strong); border-radius: var(--radius); font-family: var(--font-read); }
  .jv__empty .btn { margin-top: .8rem; }
  .jv__state { margin: 2rem auto; max-width: 34rem; text-align: center; font-family: var(--font-read); color: var(--text-muted); }
  .jv__state .spinner { margin: 0 auto .7rem; }
  .jv__state .banner { text-align: left; }
  .jv__state pre { margin-top: .5rem; white-space: pre-wrap; font-family: var(--font-raw); font-size: .88rem; }
  .jv__state-actions { display: flex; gap: .5rem; justify-content: center; margin-top: .9rem; }

  /* ---------- raw ---------- */
  .jv__raw { flex: 1; min-height: 0; display: flex; background: var(--surface); }
  .rawedit { flex: 1; display: flex; min-width: 0; min-height: 0; }
  .rawedit__gutter {
    flex: none; min-width: 3.4rem; padding: .75rem .65rem calc(.75rem + 16px) .5rem; overflow: hidden;
    text-align: right; white-space: pre; user-select: none;
    font-family: var(--font-raw); font-size: .92rem; line-height: 1.55; font-variant-numeric: tabular-nums;
    color: var(--text-faint); background: var(--surface-2); border-right: 1px solid var(--border);
  }
  .rawedit__text {
    flex: 1; min-width: 0; padding: .75rem; border: 0; resize: none; outline: none;
    font-family: var(--font-raw); font-size: .92rem; line-height: 1.55; font-variant-numeric: tabular-nums;
    white-space: pre; overflow: auto; background: transparent; tab-size: 4;
  }

  /* ---------- status bar ---------- */
  .statusbar {
    flex: none; display: flex; gap: 1.1rem; flex-wrap: wrap; align-items: center;
    padding: .28rem .9rem; font-size: .8rem; color: var(--text-muted);
    background: var(--sidebar-bg); border-top: 1px solid var(--border);
  }
  .statusbar__spacer { flex: 1; }
  .statusbar__warn { color: var(--danger); }
</style>

<section class="jv__rendered" data-pane="rendered" aria-label="Rendered journal">
  <div class="jv__page">
    <div class="jv__state" data-slot="state" role="status"></div>

    <div data-slot="content" hidden>
      <header class="jv__overview">
        <div>
          <h1 class="jv__heading" data-slot="heading"></h1>
          <p class="jv__sub" data-slot="subheading"></p>
        </div>
        <button class="btn btn--primary" type="button" data-act="add-txn"><span class="icon icon--plus" aria-hidden="true"></span>Add transaction</button>
      </header>

      <div class="jv__stats" data-slot="stats"></div>
      <section class="jv-top" data-slot="top" aria-label="Top spending" hidden></section>

      <div class="jv__listhead">
        <h2 class="jv__listtitle">Transactions</h2>
        <span class="jv__listmeta" data-slot="list-meta"></span>
      </div>
      <div class="jv__chips" data-slot="chips" hidden></div>
      <div data-slot="list"></div>
      <div class="jv__empty" data-slot="empty" hidden></div>
    </div>
  </div>
</section>

<section class="jv__raw" data-pane="raw" aria-label="Raw file text" hidden>
  <div class="rawedit">
    <div class="rawedit__gutter" data-slot="gutter" aria-hidden="true"></div>
    <textarea class="rawedit__text" data-slot="text" spellcheck="false" wrap="off" aria-label="Raw file text"></textarea>
  </div>
</section>

<footer class="statusbar" data-slot="status">
  <span data-slot="status-view"></span>
  <span data-slot="status-pos"></span>
  <span class="statusbar__spacer"></span>
  <span data-slot="status-sync"></span>
  <span>UTF-8</span>
  <span data-slot="status-saved"></span>
</footer>
