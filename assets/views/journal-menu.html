<nav class="menubar" aria-label="File menu">

  <!-- Transactions (first: it is the primary thing to do here). Same row language as Reports and Sort: a plain list. -->
  <div class="menubar__item" data-menu="transactions">
    <button class="menubar__btn" type="button" aria-haspopup="true" aria-expanded="false"
      data-needs="rendered">Transactions<span class="menubar__badge" data-slot="sel-badge" hidden></span></button>
    <div class="menubar__panel menubar__panel--narrow" role="group" aria-label="Transactions" hidden>
      <button class="menubar__entry" type="button" data-act="add-txn"><span class="menubar__entry-main"><span
            class="icon icon--plus" aria-hidden="true"></span>Add transaction</span><span class="kbd"
          data-shortcut="addTransaction" hidden></span></button>
      <div class="menubar__sep" role="separator"></div>
      <button class="menubar__entry" type="button" data-act="toggle-select" aria-pressed="false">Select
        transactions</button>
      <button class="menubar__entry" type="button" data-act="select-visible">Select all visible</button>
      <button class="menubar__entry" type="button" data-act="clear-selection">Clear selection</button>
      <div class="menubar__sep" role="separator"></div>
      <button class="menubar__entry menubar__entry--danger" type="button" data-act="delete-selected">Delete
        selected…</button>
    </div>
  </div>

  <!-- Reports (journals only) -->
  <div class="menubar__item" data-menu="reports">
    <button class="menubar__btn" type="button" aria-haspopup="true" aria-expanded="false"
      data-needs="journal">Reports</button>
    <div class="menubar__panel" role="group" aria-label="Reports" hidden>
      <div class="menubar__group">
        <label class="field">
          <span class="field__label">Query (optional)</span>
          <input class="input" type="text" name="query" placeholder="e.g. acct:assets depth:2" autocomplete="off"
            spellcheck="false">
        </label>
        <label class="menubar__check">
          <input type="checkbox" name="forecast"> Include forecast transactions
        </label>
      </div>
      <div class="menubar__group">
        <div class="menubar__label">Validate</div>
        <button class="menubar__entry" type="button" data-report="check">Check</button>
        <button class="menubar__entry" type="button" data-report="checkstrict">Strict check</button>
      </div>
      <div class="menubar__group">
        <div class="menubar__label">Listings</div>
        <button class="menubar__entry" type="button" data-report="accounts">Accounts</button>
        <button class="menubar__entry" type="button" data-report="payees">Payees</button>
        <button class="menubar__entry" type="button" data-report="commodities">Commodities</button>
        <button class="menubar__entry" type="button" data-report="tags">Tags</button>
      </div>
      <div class="menubar__group">
        <div class="menubar__label">Reports</div>
        <button class="menubar__entry" type="button" data-report="balance">Balance</button>
        <button class="menubar__entry" type="button" data-report="register">Register</button>
        <button class="menubar__entry" type="button" data-report="print">Print</button>
        <button class="menubar__entry" type="button" data-report="prices">Prices</button>
      </div>
      <div class="menubar__group">
        <div class="menubar__label">Statements</div>
        <button class="menubar__entry" type="button" data-report="balancesheet">Balance sheet</button>
        <button class="menubar__entry" type="button" data-report="incomestatement">Income statement</button>
        <button class="menubar__entry" type="button" data-report="cashflow">Cash flow</button>
        <button class="menubar__entry" type="button" data-report="budget">Budget report</button>
      </div>
      <div class="menubar__group">
        <div class="menubar__label">Export</div>
        <button class="menubar__entry" type="button" data-report="printtext">Cleaned-up journal text</button>
        <button class="menubar__entry" type="button" data-file-action="download">Download this file</button>
      </div>
    </div>
  </div>

  <!-- Filters (rendered view of journals). Applied as you type; there is no Apply button. -->
  <div class="menubar__item" data-menu="filters">
    <button class="menubar__btn" type="button" aria-haspopup="true" aria-expanded="false"
      data-needs="rendered">Filters<span class="menubar__badge" data-slot="filter-count" hidden></span></button>
    <form class="menubar__panel" data-form="filters" aria-label="Filters" autocomplete="off" novalidate hidden>
      <div class="menubar__group">
        <div class="field">
          <label class="field__label" for="jm-account">Account contains</label>
          <input class="input" id="jm-account" name="account" placeholder="e.g. expenses:food" autocomplete="off">
        </div>
        <div class="field menubar__gap">
          <label class="field__label" for="jm-desc">Description contains</label>
          <input class="input" id="jm-desc" name="desc" placeholder="e.g. amazon" autocomplete="off">
        </div>
        <div class="menubar__grid menubar__gap">
          <div class="field"><label class="field__label" for="jm-from">From date</label><input class="input"
              id="jm-from" name="from" type="date"></div>
          <div class="field"><label class="field__label" for="jm-to">To date</label><input class="input" id="jm-to"
              name="to" type="date"></div>
          <div class="field"><label class="field__label" for="jm-min">Min posting amount</label><input class="input"
              id="jm-min" name="min" type="number" min="0" step="any" inputmode="decimal" placeholder="e.g. 100"></div>
          <div class="field"><label class="field__label" for="jm-max">Max posting amount</label><input class="input"
              id="jm-max" name="max" type="number" min="0" step="any" inputmode="decimal" placeholder="e.g. 5000"></div>
        </div>
        <p class="menubar__hint">Amounts compare each transaction's largest posting as a plain number. Commodities are
          not converted.</p>
        <p class="field__error menubar__gap" data-slot="filter-error" role="alert" hidden></p>
      </div>
      <div class="menubar__row">
        <button class="btn" type="button" data-act="clear-filters">Clear filters</button>
      </div>
    </form>
  </div>

  <!-- Sort (rendered view of journals). Applies the moment you pick one. -->
  <div class="menubar__item" data-menu="sort">
    <button class="menubar__btn" type="button" aria-haspopup="true" aria-expanded="false"
      data-needs="rendered">Sort</button>
    <form class="menubar__panel menubar__panel--narrow" aria-label="Sort transactions" data-form="sort"
      autocomplete="off" novalidate hidden>
      <label class="menubar__radio"><input type="radio" name="sort" value="date-desc" checked> Date, newest
        first</label>
      <label class="menubar__radio"><input type="radio" name="sort" value="date-asc"> Date, oldest first</label>
      <label class="menubar__radio"><input type="radio" name="sort" value="desc-asc"> Description A–Z</label>
      <label class="menubar__radio"><input type="radio" name="sort" value="desc-desc"> Description Z–A</label>
      <label class="menubar__radio"><input type="radio" name="sort" value="amount-desc"> Largest posting, high to
        low</label>
      <label class="menubar__radio"><input type="radio" name="sort" value="amount-asc"> Largest posting, low to
        high</label>
      <p class="menubar__hint">“Largest posting” is the biggest single posting in each transaction, not a total.</p>
    </form>
  </div>

  <!-- Search -->
  <div class="menubar__item" data-menu="search">
    <button class="menubar__btn" type="button" aria-haspopup="true" aria-expanded="false">Search<span class="kbd"
        data-shortcut="focusSearch" hidden></span></button>
    <div class="menubar__panel" role="group" aria-label="Search" hidden>
      <div class="menubar__group">
        <label class="field">
          <span class="field__label">Find in this file</span>
          <input class="input" type="search" name="search" placeholder="e.g. coffee" autocomplete="off">
        </label>
        <div class="find-opts" role="group" aria-label="Find options">
          <button class="find-opt" type="button" name="findCase" aria-pressed="false" title="Match Case">Aa</button>
          <button class="find-opt" type="button" name="findWord" aria-pressed="false"
            title="Match Whole Word"><u>ab</u></button>
          <button class="find-opt" type="button" name="findRegexp" aria-pressed="false"
            title="Use Regular Expression">.*</button>
        </div>
        <p class="menubar__hint" data-slot="search-count" aria-live="polite"></p>
        <p class="menubar__hint" data-slot="search-help"></p>
      </div>
      <div class="menubar__group" data-slot="recent-group" hidden>
        <div class="menubar__label">Recent</div>
        <div class="menubar__chips" data-slot="recent"></div>
      </div>
    </div>
  </div>

  <!-- View -->
  <div class="menubar__item" data-menu="view">
    <button class="menubar__btn" type="button" aria-haspopup="true" aria-expanded="false">View</button>
    <form class="menubar__panel menubar__panel--narrow" aria-label="View" autocomplete="off" novalidate hidden>
      <label class="menubar__radio"><input type="radio" name="view" value="rendered"> Rendered</label>
      <label class="menubar__radio"><input type="radio" name="view" value="raw"> Raw text</label>
    </form>
  </div>

</nav>
